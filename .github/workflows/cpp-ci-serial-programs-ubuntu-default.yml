name: C++ CI Serial Programs Ubuntu Default
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# When a new event arrives on the same ref (e.g. a new commit pushed to a PR),
# immediately cancel the in-progress workflow started by the older event.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/cpp-ci-serial-programs-base.yml
    with:
      os: ubuntu-26.04
      compiler: default
      # clang-query checks the source, not the compiled code, so it only needs to run in one
      # job. This is the fastest Linux build (GCC with no optimization).
      run-clang-query: true
      run-tests: true
