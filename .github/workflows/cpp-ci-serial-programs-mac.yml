name: C++ CI Serial Programs Mac
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/cpp-ci-serial-programs-base.yml
    with:
      os: macos-15
      compiler: default
      run-tests: true